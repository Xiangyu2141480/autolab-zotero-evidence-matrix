name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip setuptools
      - run: python -m pip install ".[dev]"
      - run: python -m pytest -q
      - run: python -m ruff check .
      - run: python -m pip_audit
      - name: Scan for credentials
        run: |
          python - <<'PY'
          import pathlib
          import re
          import sys

          pattern = re.compile(r'(?i)(api[_-]?key|secret|token|password)\s*[:=]\s*["\'][A-Za-z0-9_-]{12,}')
          matches = []
          for path in pathlib.Path('.').rglob('*'):
              if path.is_file() and '.git' not in path.parts:
                  matches.extend(f'{path}:{line}' for line, text in enumerate(path.read_text(errors='ignore').splitlines(), 1) if pattern.search(text))
          print('\n'.join(matches))
          sys.exit(bool(matches))
          PY
